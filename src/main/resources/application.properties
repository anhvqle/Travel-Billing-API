spring.application.name=travel-billing

# The database is a single SQLite file, created in the folder you start the app from.
#   journal_mode=WAL  -> readers can keep reading while one writer is saving
#   busy_timeout=10000 -> if another request is writing, wait up to 10 s instead of failing
#   foreign_keys=true -> enforce links between tables (SQLite has this OFF by default)
#   transaction_mode=IMMEDIATE -> every DB transaction takes the write lock when it starts, so a
#                                 read-then-write (check duplicate, then insert) waits its turn instead of failing
spring.datasource.url=jdbc:sqlite:travel-billing.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true&transaction_mode=IMMEDIATE

# Run src/main/resources/schema.sql on every startup to create the tables (it only creates missing ones).
spring.sql.init.mode=always

# JSON style, matching the fixtures:
#   SNAKE_CASE: Java's flightNumber <-> JSON's flight_number (no annotations needed on every field)
#   non_null: leave out empty optional fields (e.g. a tax line without a rate) instead of writing "rate": null
#   use-big-decimal-for-floats: read decimals like 0.07 exactly, never through floating point
#   strip-trailing-bigdecimal-zeroes=false: keep 220.00 as 220.00 inside invoice snapshots (Jackson would write 2.2E+2)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.datatype.json-node.strip-trailing-bigdecimal-zeroes=false
